<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Password Change</title>
</head>
<body>
<h2>Hello, <span th:text="${name}">User</span>!</h2>
<p>Please confirm your password change by clicking the button below:</p>

<a th:href="${confirmationUrl}"
   style="display: inline-block; padding: 12px 24px; background: #28a745; color: white; text-decoration: none; border-radius: 4px;">
    Confirm Password Change
</a>

<p>If the button doesn't work, copy this link:</p>
<p th:text="${confirmationUrl}"></p>

<div style="background-color: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; margin: 20px 0;">
    <p><strong>⚠️ Security Notice:</strong></p>
    <p>If you did NOT request this password change, please ignore this email.</p>
</div>

<p><small>This link will expire in 10 minutes.</small></p>
</body>
</html>
